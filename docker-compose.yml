version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: harborai
      POSTGRES_PASSWORD: harborai
      POSTGRES_DB: harborai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborai -d harborai"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./src/backend
    working_dir: /workspace
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg2://harborai:harborai@db:5432/harborai
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/backend:/workspace/src/backend
      - ./migrations:/workspace/migrations
      - ./alembic.ini:/workspace/alembic.ini:ro

  backend:
    build:
      context: ./src/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://harborai:harborai@db:5432/harborai
      DATABASE_URL_SYNC: postgresql+psycopg2://harborai:harborai@db:5432/harborai
      TEST_DATABASE_URL: postgresql+asyncpg://harborai:harborai@db:5432/harborai_test
      SEED_DB: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src/backend:/app

volumes:
  pg_data:
